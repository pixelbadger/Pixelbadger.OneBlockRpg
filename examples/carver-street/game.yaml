# The introduction (§7.2): pages of light markdown read before play. The `intro` below is the cold open.
introduction:
  title: "41 Carver Street"
  pages:
    - |
      # The building

      **41 Carver Street** is five storeys of soot-dark brick on a street of corner shops and bus stops. Nine
      flats, a basement nobody goes into, a lobby with a cracked tile floor that Mrs Okafor sweeps every morning
      at eight. The radiators knock. The lift has been "being looked at" since spring.

      It isn't much. It's home to everyone in it, and none of them could afford anywhere else.
    - |
      # You

      You are **Sam Reyes**, of flat 2B. Bike courier. Good at stairs. You've lived here two years, and you owe
      *three months'* rent.

      Your neighbours, more or less:

      - **Mrs Okafor**, the caretaker, nineteen years in the job. She knows everybody's business and keeps most
        of it to herself.
      - **Dev**, in 3B, who teaches music and keeps his door shut.
      - **Ravi**, who runs the corner shop and knows everyone on the street by what they buy.

      The landlord you have never met. Since his stroke his affairs are handled by an agent, **Mr Pike**.
    - |
      # This week

      For a week now the building has felt wrong, in small ways you could explain away one at a time and can't
      explain all together. Doors that used to stand open are locked. People who used to chat on the stairs go
      quiet when Mr Pike's car is outside. And late at night, on the stairs, there's a girl you're sure doesn't
      live here.

      > If the building goes, you go with it. Nobody is going to fight for a courier three months behind.

      So find out what's happening to 41 Carver Street, and whether it can be stopped. Talk to people; they know
      more than they say. Look at things; paper tells the truth more often than people do. And watch the clock:
      the week is short.
intro: >
  You wake in 2B with the radiator knocking. Somewhere below, a broom works the lobby tiles.
  The building has felt wrong all week: new locks on the basement, a man in a good coat
  measuring the stairwell, envelopes for Dev in 3B that never have stamps.
style_guide: >
  Contemporary urban realism with a faint undertow of the uncanny. Short sentences. Dialogue
  is clipped and specific; people talk around what they want. Nobody explains themselves fully.
  Never break the fourth wall. British English.
downed:
  mode: wake-robbed
  room: street
  text: "You come to on the pavement outside, your head ringing. Someone has been through your pockets."
xp: { check: 5, fight: 25 }
