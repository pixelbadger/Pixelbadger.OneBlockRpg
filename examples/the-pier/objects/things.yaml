# Everything else: tools, the fire's makings, food and drink, beds and doors.

# ─── The site ───
# Site gear is Gary's. Anyone he trusts at all may use it; someone he doesn't is taking it. Tools circulate: Tommo
# picks the bar up in the morning and drops it back at knocking-off time, so where it is depends on the hour.
- id: crowbar
  name: crowbar
  aliases: [bar, wrecking bar, jemmy]
  location: compound
  description: "A three-foot wrecking bar, orange paint worn back to the steel at both ends."
  affordances: [takeable]
  tags: [pry]
  owner: gary
  permitted: { relationship: { who: gary, with: self, trust: { gte: 5 } } }
  properties: { mass: 3, value: 12 }
  weapon: { type: blunt, skill: melee_weapons, damage: [3, 8], ap: 4, min_st: 4 }
- id: claw-hammer
  name: claw hammer
  aliases: [hammer, claw]
  location: marek
  description: "Marek's claw hammer, the handle wrapped in black tape worn grey where his hand goes."
  affordances: [takeable]
  tags: [claw]
  owner: marek
  properties: { mass: 0.8, value: 8 }
  weapon: { type: blunt, skill: melee_weapons, damage: [2, 6], ap: 3, min_st: 2 }
- id: toolbox
  name: Marek's toolbox
  aliases: [toolbox, tool box, box, tools]
  location: hotel-corridor
  room_text: "Marek's red toolbox sits open against the wall."
  description: "A red steel toolbox, MAREK N. scratched in the lid. Everything in it is clean."
  affordances: [container, takeable]
  owner: marek
  permitted: { relationship: { who: marek, with: self, trust: { gte: 20 } } }
  properties: { mass: 6, value: 20 }
- id: screwdriver
  name: screwdriver
  aliases: [screwdriver, driver]
  location: toolbox
  description: "A long flat-bladed screwdriver, the kind that's been sharpened on a step."
  affordances: [takeable]
  tags: [screwdriver]
  owner: marek
  permitted: { relationship: { who: marek, with: self, trust: { gte: 20 } } }
  properties: { mass: 0.2, value: 3 }
- id: petrol-can
  name: petrol can
  aliases: [petrol, jerrycan, can, fuel]
  location: compound
  description:
    - when: { property: { object: petrol-can, key: fuel, op: lte, value: 0 } }
      text: "A red jerrycan for the generator, empty. It smells like a headache."
    - text: "A red jerrycan of petrol for the generator. It sloshes: there's a good few litres in it."
  room_text: "A red jerrycan stands by the generator."
  affordances: [takeable]
  owner: gary
  permitted: { relationship: { who: gary, with: self, trust: { gte: 5 } } }
  properties: { mass: 12, value: 15, fuel: 10 }
# The generator burns through its fuel over the working day; Gary tops it up from the can (behaviours/site.yaml).
# If the can has walked, he'll notice.
- id: generator
  name: generator
  aliases: [genny]
  location: compound
  scenery: true
  description:
    - when: { property: { object: generator, key: fuel, op: lte, value: 0 } }
      text: "The yellow site generator, silent, out of petrol. Nothing on site has power."
    - text: "A yellow site generator that thuds all day and coughs at night."
  behaviours: [generator-burns]
  properties: { mass: 300, fuel: 3 }
  uses:
    - on: petrol-can
      when: { property: { object: petrol-can, key: fuel, op: gte, value: 2 } }
      text: "You top the generator up from the can. It coughs and thuds back up to speed."
      effects:
        - { adjust_property: { object: generator, key: fuel, by: 4 } }
        - { adjust_property: { object: petrol-can, key: fuel, by: -2 } }
      minutes: 3
    - on: petrol-can
      text: "There isn't enough in the can to bother with."
