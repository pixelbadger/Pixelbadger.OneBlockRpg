# Gary's timesheet: the work sim's ledger. Strikes for being off site when he looks; three and you're done.
- id: timesheet
  name: timesheet
  aliases: [timesheet, clipboard, sheet, rota]
  location: site-office
  scenery: true
  owner: gary
  description:
    - when: { property: { object: timesheet, key: sacked, value: true } }
      text: "Gary's clipboard. DOYLE has a line through it, pressed hard enough to tear the paper."
    - when: { property: { object: timesheet, key: strikes, op: gte, value: 1 } }
      text: "Gary's clipboard of names and times. Next to DOYLE: {{objects.timesheet.strikes}} in red, each one a time he looked for you and you weren't there."
    - text: "Gary's clipboard of names and times. DOYLE, NOWAK, RAFFERTY. Your column is clean, for now."
  properties: { strikes: 0, covered: 0, sacked: false }
- id: camp-bed
  name: camp bed
  location: site-office
  scenery: true
  description: "A camp bed with a sleeping bag balled at one end. Gary does not sleep on it."
  affordances: [sleepable]
  properties: { mass: 6 }
- id: hard-hat
  name: hard hat
  aliases: [hat, helmet]
  location: digs
  description: "Your hard hat, white, with DOYLE on it in marker and a sticker from a job in Swindon."
  affordances: [takeable]
  properties: { mass: 0.4, value: 3 }
  armour: { ac: 1, dt: 1, dr: 5 }

# ─── The fire's makings ───
- id: matches
  name: box of matches
  aliases: [matches, match, box]
  location: dresser
  description: "A box of Swan Vestas, nearly full."
  affordances: [takeable]
  properties: { mass: 0.05, value: 1 }
- id: deckchairs
  name: stacked deckchairs
  aliases: [deckchairs, deckchair, chairs, stack]
  location: glass-house
  scenery: true
  description:
    - when: { property: { object: deckchairs, key: soaked, value: true } }
      text: "The deckchairs are dark with petrol. The fumes make the green light swim."
    - text: "Hundreds of wooden deckchairs stacked to the roof, striped canvas gone pale. Dry as tinder. Dry as anything."
  properties: { mass: 400, soaked: false }
  uses:
    - on: petrol-can
      when: { all: [ { flag: breakdown }, { property: { object: petrol-can, key: fuel, op: gt, value: 0 } } ] }
      text: "You unscrew the cap and walk the length of the stack, slopping petrol over the canvas and the old wood. Your hands are very steady."
      effects:
        - { set_property: { object: deckchairs, key: soaked, value: true } }
        - { set_property: { object: petrol-can, key: fuel, value: 0 } }
      noise: { loudness: 3, sound: "liquid slopping, and the reek of petrol" }
      minutes: 5
    - on: petrol-can
      when: { flag: breakdown }
      text: "You tip the can over the stack. A dribble, a drip. It's empty. It doesn't matter."
    - on: petrol-can
      text: "You stand with the can in your hand for a long time. Then you put the cap back on. Not yet. Not you."
    - on: matches
      when: { flag: breakdown }
      text: "The match flares. You hold it to the canvas, and the canvas takes it as if it has been waiting."
      effects: [ { set_flag: glass_house_burning } ]
    - on: matches
      text: "You strike a match and hold it until it burns down to your fingers. You don't know why you did that."

